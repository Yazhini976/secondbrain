services:
  - type: web
    name: second-brain-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEV_MODE_ENABLED
        value: "false"
      - key: TESTING
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost,http://localhost:8080,http://127.0.0.1,http://10.0.2.2"
