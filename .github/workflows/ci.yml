name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Tests
        working-directory: backend
        env:
          ENVIRONMENT: testing
          TESTING: "true"
          FIREBASE_DEV_MODE: "true"
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/second_brain_test
        run: |
          pytest -v

      - name: Validate Backend Docker Build
        working-directory: backend
        run: |
          docker build -t second-brain-api:latest .

  mobile-analyze:
    name: Mobile Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze
